[project]
name = "agenticrag"
version = "0.1.0"
description = "Agentic Customer Support RAG system with LangGraph, Pinecone, Tavily, and FastAPI"
readme = "README.md"
authors = [
    { name = "Tilak chowdary", email = "tilakchowdary5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11,<2.0.0",
    "langchain>=1.3.16,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-groq>=1.1.3,<2.0.0",
    "langchain-pinecone>=0.2.13,<1.0.0",
    "langchain-community>=0.4.2,<1.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "langchain-tavily>=0.2.18,<1.0.0",
    "pinecone>=7.3.0,<8.0.0",
    "fastembed>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "fastapi>=0.143.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "slowapi>=0.1.10,<1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
]

[project.optional-dependencies]
ingest = [
    "datasets>=3.0.0,<6.0.0",
]

[project.scripts]
agenticrag = "agenticrag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "datasets>=3.0.0,<6.0.0",
    "httpx>=0.28.1",
    "mypy>=1.10.0",
    "pip-audit>=2.10.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true
