[project]
name = "agenticrag"
version = "0.1.0"
description = "Agentic Customer Support RAG system with LangGraph, Pinecone, Tavily, and FastAPI"
readme = "README.md"
authors = [
    { name = "Tilak chowdary", email = "tilakchowdary5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langgraph==1.2.11",
    "langchain==1.3.16",
    "langchain-core==1.6.0",
    "langchain-groq==1.1.3",
    "langchain-huggingface==1.2.2",
    "langchain-pinecone==0.2.13",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-tavily==0.2.18",
    "pinecone==7.3.0",
    "fastembed>=0.2.6",
    "beautifulsoup4==4.15.0",
    "python-dotenv==1.2.3",
    "datasets>=5.1.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.10",
]

[project.scripts]
agenticrag = "agenticrag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

