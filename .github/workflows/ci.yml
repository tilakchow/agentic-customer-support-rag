name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * *"  # Nightly run at 02:00 UTC

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --extra ingest

      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Check
        run: uv run mypy src/ --ignore-missing-imports

      - name: Run Pytest with Coverage
        run: uv run pytest tests/ -v --cov=src/agenticrag --cov-fail-under=85

      - name: Run pip-audit Dependency Vulnerability Scan
        run: uv run pip-audit

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc -b

      - name: Run Vitest Suite
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build

      - name: Run npm Audit
        run: npm audit --audit-level=moderate

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: agenticrag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --extra ingest

      - name: Run Retrieval Eval Gate
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          THRESH=$(python3 -c "import json; b = json.load(open('evals/baseline.json')); print(round(b['recall@4']['mean'] - 0.05, 3))")
          uv run python evals/retrieval_eval.py evals/golden.jsonl dev "$THRESH"

      - name: Run Quality Evals
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest tests/quality -m live

