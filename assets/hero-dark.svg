<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <linearGradient id="hero-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="hero-accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="296" rx="20" fill="url(#hero-bg-dark)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Glowing Nebulas -->
  <circle cx="1080" cy="60" r="140" fill="#6366F1" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="120" cy="240" r="130" fill="#0D9488" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="900" cy="230" r="80" fill="#F59E0B" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(600, 52)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.2"/>
    <circle cx="-96" cy="0" r="4" fill="#818CF8"/>
    <text x="-84" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1">SELF-CORRECTING AGENT</text>
  </g>

  <!-- Title -->
  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Agentic Customer Support RAG</text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94A3B8">Self-correcting RAG agent: scope gates, reranking, evidence grading, claim checks</text>

  <!-- Tech Chips Row -->
  <g transform="translate(600, 228)">
    <!-- LangGraph -->
    <g transform="translate(-310, -18)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#818CF8"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">LangGraph</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(-186, -18)">
      <rect x="0" y="0" width="98" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#34D399"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">FastAPI</text>
    </g>

    <!-- Pinecone -->
    <g transform="translate(-76, -18)">
      <rect x="0" y="0" width="108" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#60A5FA"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Pinecone</text>
    </g>

    <!-- Groq -->
    <g transform="translate(44, -18)">
      <rect x="0" y="0" width="86" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#FBBF24"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Groq</text>
    </g>

    <!-- React 19 -->
    <g transform="translate(142, -18)">
      <rect x="0" y="0" width="102" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#38BDF8"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">React 19</text>
    </g>
  </g>
</svg>
