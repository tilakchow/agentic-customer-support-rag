<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <linearGradient id="hero-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="hero-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="296" rx="20" fill="url(#hero-bg-light)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="1100" cy="50" r="180" fill="#4F46E5" fill-opacity="0.04"/>
  <circle cx="100" cy="250" r="140" fill="#0D9488" fill-opacity="0.04"/>
  <circle cx="950" cy="220" r="90" fill="#D97706" fill-opacity="0.03"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(600, 52)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <circle cx="-96" cy="0" r="4" fill="#4F46E5"/>
    <text x="-84" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4338CA" letter-spacing="1">SELF-CORRECTING AGENT</text>
  </g>

  <!-- Title -->
  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Agentic Customer Support RAG</text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Self-correcting RAG agent: scope gates, reranking, evidence grading, claim checks</text>

  <!-- Tech Chips Row -->
  <g transform="translate(600, 228)">
    <!-- LangGraph -->
    <g transform="translate(-310, -18)" filter="url(#shadow)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#4F46E5"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">LangGraph</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(-186, -18)" filter="url(#shadow)">
      <rect x="0" y="0" width="98" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#059669"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">FastAPI</text>
    </g>

    <!-- Pinecone -->
    <g transform="translate(-76, -18)" filter="url(#shadow)">
      <rect x="0" y="0" width="108" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#2563EB"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Pinecone</text>
    </g>

    <!-- Groq -->
    <g transform="translate(44, -18)" filter="url(#shadow)">
      <rect x="0" y="0" width="86" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#F59E0B"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Groq</text>
    </g>

    <!-- React 19 -->
    <g transform="translate(142, -18)" filter="url(#shadow)">
      <rect x="0" y="0" width="102" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#0284C7"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">React 19</text>
    </g>
  </g>
</svg>
